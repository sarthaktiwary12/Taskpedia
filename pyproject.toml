[project]
name = "taskpedia"
version = "0.3.0"
description = "TASKPEDIA: Hierarchical Decomposition of Human Tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TASKPEDIA Team" }
]
keywords = ["robotics", "embodied-ai", "task-taxonomy", "humanoid", "hierarchical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    # LLM
    "google-genai>=1.0.0",
    # Resilience & Caching
    "tenacity>=8.2.0",
    "diskcache>=5.6.0",
    "ratelimit>=2.2.1",
    # Parallelization
    "ray[default]>=2.9.0",
    # Data loading
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
    # TUI
    "textual>=0.89.0",
    "rich>=13.7.0",
    "plotext>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
taskpedia = "taskpedia.cli:main"

[project.urls]
Repository = "https://github.com/taskpedia/taskpedia"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskpedia"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["taskpedia"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
